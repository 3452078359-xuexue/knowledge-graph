name: Validate public snapshot

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/validate_public_snapshot.py
      - run: python scripts/lint_guiyang_schema.py schemas/guiyang/CityTourism.schema
