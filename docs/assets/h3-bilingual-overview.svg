<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">H3 hierarchical spatial index bilingual overview</title>
  <desc id="desc">An original bilingual diagram showing a stylized city map under a hexagonal grid, R7 R8 R9 resolutions, and the nearby query pipeline used by the Guiyang tourism knowledge graph.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#081a35"/>
      <stop offset="1" stop-color="#123e62"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#173e62" stop-opacity="0.96"/>
      <stop offset="1" stop-color="#0c2947" stop-opacity="0.96"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#020817" flood-opacity="0.45"/>
    </filter>
    <g id="hex">
      <path d="M 28 0 L 56 16 L 56 48 L 28 64 L 0 48 L 0 16 Z"/>
    </g>
    <g id="poi">
      <circle cx="0" cy="0" r="8" fill="#ffcf5a" stroke="#fff4c7" stroke-width="3"/>
      <circle cx="0" cy="0" r="2.4" fill="#17314d"/>
    </g>
  </defs>

  <rect width="1200" height="680" rx="28" fill="url(#bg)"/>
  <circle cx="105" cy="95" r="180" fill="#26d0ce" opacity="0.07"/>
  <circle cx="610" cy="610" r="260" fill="#7b8cff" opacity="0.06"/>

  <text x="54" y="66" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="31" font-weight="700">H3 层级空间索引 / Hierarchical Spatial Index</text>
  <text x="55" y="100" fill="#9ec9e8" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="16">贵阳城市旅游知识图谱 · Guiyang City Tourism Knowledge Graph</text>

  <g transform="translate(48 130)" filter="url(#shadow)">
    <rect width="704" height="428" rx="22" fill="#edf5f7"/>
    <path d="M 20 98 C 140 22, 246 150, 355 74 S 575 12, 688 104" fill="none" stroke="#c8d8dc" stroke-width="17" opacity="0.9"/>
    <path d="M 60 410 C 104 300, 188 314, 245 218 S 400 118, 468 195 S 584 338, 688 262" fill="none" stroke="#c3d4d8" stroke-width="12"/>
    <path d="M 14 230 C 108 184, 218 262, 310 216 S 516 166, 692 214" fill="none" stroke="#d7e2e4" stroke-width="7"/>
    <path d="M 140 24 C 132 104, 180 180, 154 270 S 126 370, 176 418" fill="none" stroke="#d7e2e4" stroke-width="7"/>
    <path d="M 500 10 C 465 104, 505 184, 475 274 S 448 360, 510 420" fill="none" stroke="#d7e2e4" stroke-width="7"/>

    <g fill="none" stroke="#2d5874" stroke-width="1.7" opacity="0.74" transform="translate(22 8)">
      <use href="#hex" x="0" y="0"/><use href="#hex" x="56" y="0"/><use href="#hex" x="112" y="0"/><use href="#hex" x="168" y="0"/><use href="#hex" x="224" y="0"/><use href="#hex" x="280" y="0"/><use href="#hex" x="336" y="0"/><use href="#hex" x="392" y="0"/><use href="#hex" x="448" y="0"/><use href="#hex" x="504" y="0"/><use href="#hex" x="560" y="0"/>
      <use href="#hex" x="28" y="48"/><use href="#hex" x="84" y="48"/><use href="#hex" x="140" y="48"/><use href="#hex" x="196" y="48"/><use href="#hex" x="252" y="48"/><use href="#hex" x="308" y="48"/><use href="#hex" x="364" y="48"/><use href="#hex" x="420" y="48"/><use href="#hex" x="476" y="48"/><use href="#hex" x="532" y="48"/>
      <use href="#hex" x="0" y="96"/><use href="#hex" x="56" y="96"/><use href="#hex" x="112" y="96"/><use href="#hex" x="168" y="96"/><use href="#hex" x="224" y="96"/><use href="#hex" x="280" y="96"/><use href="#hex" x="336" y="96"/><use href="#hex" x="392" y="96"/><use href="#hex" x="448" y="96"/><use href="#hex" x="504" y="96"/><use href="#hex" x="560" y="96"/>
      <use href="#hex" x="28" y="144"/><use href="#hex" x="84" y="144"/><use href="#hex" x="140" y="144"/><use href="#hex" x="196" y="144"/><use href="#hex" x="252" y="144"/><use href="#hex" x="308" y="144"/><use href="#hex" x="364" y="144"/><use href="#hex" x="420" y="144"/><use href="#hex" x="476" y="144"/><use href="#hex" x="532" y="144"/>
      <use href="#hex" x="0" y="192"/><use href="#hex" x="56" y="192"/><use href="#hex" x="112" y="192"/><use href="#hex" x="168" y="192"/><use href="#hex" x="224" y="192"/><use href="#hex" x="280" y="192"/><use href="#hex" x="336" y="192"/><use href="#hex" x="392" y="192"/><use href="#hex" x="448" y="192"/><use href="#hex" x="504" y="192"/><use href="#hex" x="560" y="192"/>
      <use href="#hex" x="28" y="240"/><use href="#hex" x="84" y="240"/><use href="#hex" x="140" y="240"/><use href="#hex" x="196" y="240"/><use href="#hex" x="252" y="240"/><use href="#hex" x="308" y="240"/><use href="#hex" x="364" y="240"/><use href="#hex" x="420" y="240"/><use href="#hex" x="476" y="240"/><use href="#hex" x="532" y="240"/>
      <use href="#hex" x="0" y="288"/><use href="#hex" x="56" y="288"/><use href="#hex" x="112" y="288"/><use href="#hex" x="168" y="288"/><use href="#hex" x="224" y="288"/><use href="#hex" x="280" y="288"/><use href="#hex" x="336" y="288"/><use href="#hex" x="392" y="288"/><use href="#hex" x="448" y="288"/><use href="#hex" x="504" y="288"/><use href="#hex" x="560" y="288"/>
      <use href="#hex" x="28" y="336"/><use href="#hex" x="84" y="336"/><use href="#hex" x="140" y="336"/><use href="#hex" x="196" y="336"/><use href="#hex" x="252" y="336"/><use href="#hex" x="308" y="336"/><use href="#hex" x="364" y="336"/><use href="#hex" x="420" y="336"/><use href="#hex" x="476" y="336"/><use href="#hex" x="532" y="336"/>
    </g>

    <g fill="none" stroke="#635bff" stroke-width="7" opacity="0.82">
      <path d="M 22 104 L 190 8 L 358 104 L 358 296 L 190 392 L 22 296 Z"/>
      <path d="M 358 104 L 526 8 L 694 104 L 694 296 L 526 392 L 358 296 Z"/>
    </g>

    <use href="#poi" x="152" y="114"/><use href="#poi" x="286" y="188"/><use href="#poi" x="410" y="136"/><use href="#poi" x="564" y="252"/><use href="#poi" x="236" y="324"/><use href="#poi" x="470" y="352"/>
    <g transform="translate(338 220)">
      <path d="M 0 -28 C 20 -28 33 -15 33 3 C 33 25 0 55 0 55 C 0 55 -33 25 -33 3 C -33 -15 -20 -28 0 -28 Z" fill="#ff5c7a" stroke="#ffffff" stroke-width="4"/>
      <circle r="10" fill="#ffffff"/>
    </g>
    <text x="30" y="405" fill="#24465d" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="14" font-weight="600">候选格召回 ≠ 最终距离 / Candidate cells ≠ final distance</text>
  </g>

  <g transform="translate(782 130)" filter="url(#shadow)">
    <rect width="370" height="428" rx="22" fill="url(#panel)"/>
    <text x="28" y="48" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="20" font-weight="700">多分辨率职责 / Resolution roles</text>

    <g transform="translate(28 78)">
      <rect width="314" height="82" rx="14" fill="#635bff" opacity="0.95"/>
      <text x="18" y="30" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="21" font-weight="700">R7 · 约 5.16 km²</text>
      <text x="18" y="57" fill="#e7e5ff" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="14">大半径粗召回 / Broad-area retrieval</text>
    </g>
    <g transform="translate(28 176)">
      <rect width="314" height="82" rx="14" fill="#1b9aaa" opacity="0.96"/>
      <text x="18" y="30" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="21" font-weight="700">R8 · 约 0.74 km²</text>
      <text x="18" y="57" fill="#ddfbff" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="14">城市空间骨架 / City spatial framework</text>
    </g>
    <g transform="translate(28 274)">
      <rect width="314" height="82" rx="14" fill="#ffb84d" opacity="0.97"/>
      <text x="18" y="30" fill="#17314d" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="21" font-weight="700">R9 · 约 0.11 km²</text>
      <text x="18" y="57" fill="#17314d" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="14">POI 小半径细筛 / Fine POI filtering</text>
    </g>
    <text x="28" y="395" fill="#9ec9e8" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="13">面积为全球平均值 / Global average area</text>
  </g>

  <g transform="translate(48 588)">
    <rect width="1104" height="58" rx="18" fill="#07192f" opacity="0.88" stroke="#2c5a7d"/>
    <text x="22" y="25" fill="#91bddc" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="12">地名或定位 / Place or location</text>
    <text x="22" y="45" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="15" font-weight="600">PlaceAlias / GPS</text>
    <path d="M 220 29 H 306" stroke="#62d8d5" stroke-width="3"/>
    <text x="332" y="25" fill="#91bddc" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="12">候选召回 / Candidate retrieval</text>
    <text x="332" y="45" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="15" font-weight="600">gridDisk R9 / R7</text>
    <path d="M 535 29 H 621" stroke="#62d8d5" stroke-width="3"/>
    <text x="648" y="25" fill="#91bddc" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="12">精确计算 / Exact calculation</text>
    <text x="648" y="45" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="15" font-weight="600">真实坐标距离 / Point distance</text>
    <path d="M 889 29 H 954" stroke="#62d8d5" stroke-width="3"/>
    <text x="978" y="25" fill="#91bddc" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="12">答案 / Answer</text>
    <text x="978" y="45" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="15" font-weight="600">质量与证据精排</text>
  </g>
</svg>
